name: 构建安装包

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # ============================================================
  # Windows
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx tsc -p tsconfig.main.json
      - run: npx electron-builder --win --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: win, path: release/*.exe, retention-days: 7 }
      - name: 上传 GitHub Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} release/*.exe --clobber
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # ============================================================
  # macOS
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx tsc -p tsconfig.main.json
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_SKIP_NOTARIZATION: 'true'
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: release/*.dmg, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: mac-zip, path: release/*.zip, retention-days: 7 }
      - name: 上传 GitHub Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} release/*.dmg release/*.zip --clobber
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # ============================================================
  # Linux
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx tsc -p tsconfig.main.json
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: release/*.AppImage, retention-days: 7 }
      - name: 上传 GitHub Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} release/*.AppImage --clobber
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # ============================================================
  # 镜像到 Gitee
  # ============================================================
  mirror-gitee:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 下载全部 artifacts
        run: |
          gh run download ${{ github.run_id }} --dir packages
          echo "=== Downloaded files ==="
          find packages -type f
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

      - name: 镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 推送 tag
          git remote add gitee https://ScorchingSunnnn:$GITEE_TOKEN@gitee.com/ScorchingSunnnn/bole-simulator.git
          git push gitee ${{ github.ref }} 2>/dev/null || true

          TAG="${GITHUB_REF#refs/tags/}"
          echo "=== Mirroring $TAG to Gitee ==="

          # 获取或创建 Gitee Release
          RELEASE_ID=$(curl -sf -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/ScorchingSunnnn/bole-simulator/releases/tags/$TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating Gitee release..."
            RESP=$(curl -sf -X POST \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              "https://gitee.com/api/v5/repos/ScorchingSunnnn/bole-simulator/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Bole Simulator $TAG\",\"body\":\"GitHub Actions auto-build\",\"target_commitish\":\"master\"}")
            RELEASE_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          fi

          echo "Release ID: $RELEASE_ID"

          # 上传文件
          for f in $(find packages -type f -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage'); do
            echo "Uploading: $(basename $f)"
            curl -sf -X POST \
              -H "Authorization: token $GITEE_TOKEN" \
              -F "file=@$f" \
              "https://gitee.com/api/v5/repos/ScorchingSunnnn/bole-simulator/releases/$RELEASE_ID/attach_files" \
              && echo "  OK" || echo "  FAIL"
          done

          echo "=== Done ==="
