name: 构建安装包

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # ============================================================
  # Windows
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx tsc -p tsconfig.main.json
      - run: npx electron-builder --win --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: win, path: release/*.exe, retention-days: 7 }
      - name: 上传 GitHub Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} release/*.exe --clobber
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # ============================================================
  # macOS
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # 编译 ScreenCaptureKit 音频捕获组件（arm64 + x64），自动随包分发
      - name: 编译 macOS 音频捕获组件
        run: |
          bash scripts/build-mac-helper.sh
          bash scripts/build-mac-helper.sh --arch x86_64
      - run: npx vite build
      - run: npx tsc -p tsconfig.main.json
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_SKIP_NOTARIZATION: 'true'
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg-arm64, path: release/*-arm64.dmg, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg-x64, path: release/*-x64.dmg, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: mac-zip-arm64, path: release/*-arm64.zip, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: mac-zip-x64, path: release/*-x64.zip, retention-days: 7 }
      - name: 上传 GitHub Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} release/*.dmg release/*.zip --clobber
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # ============================================================
  # Linux
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx tsc -p tsconfig.main.json
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: release/*.AppImage, retention-days: 7 }
      - name: 上传 GitHub Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} release/*.AppImage --clobber
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # ============================================================
  # 镜像到 Gitee
  # ============================================================
  mirror-gitee:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 下载全部 artifacts
        run: |
          gh run download ${{ github.run_id }} --dir packages
          echo "=== Downloaded files ==="
          find packages -type f
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

      - name: 镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 推送 tag
          git remote add gitee https://ScorchingSunnnn:$GITEE_TOKEN@gitee.com/ScorchingSunnnn/bole-simulator.git
          git push gitee ${{ github.ref }} 2>/dev/null || true

          TAG="${GITHUB_REF#refs/tags/}"
          GITHUB_DL="https://github.com/scorching12/Bole_Music/releases/download/$TAG"

          # 列出所有文件
          FILES=$(find packages -type f -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage')
          FILE_LIST=""
          for f in $FILES; do
            FNAME=$(basename "$f")
            FSIZE=$(du -h "$f" | cut -f1)
            FILE_LIST="$FILE_LIST\n- [$FNAME]($GITHUB_DL/$FNAME) ($FSIZE)"
          done

          # 创建 Gitee Release（描述中包含 GitHub 下载链接）
          BODY="## \U0001F4E5 下载安装包\n\n> 安装包托管在 GitHub，国内下载可能较慢。\n> 推荐使用 [ghproxy.com](https://ghproxy.com) 加速。\n$FILE_LIST\n\n---\nBuilt by GitHub Actions"

          # 删除旧 Release
          OLD_ID=$(curl -sf -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/ScorchingSunnnn/bole-simulator/releases/tags/$TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -n "$OLD_ID" ]; then
            curl -sf -X DELETE -H "Authorization: token $GITEE_TOKEN" \
              "https://gitee.com/api/v5/repos/ScorchingSunnnn/bole-simulator/releases/$OLD_ID" 2>/dev/null || true
          fi

          # 创建新 Release
          echo "Creating Gitee release for $TAG..."
          RESP=$(curl -sf -X POST \
            -H "Authorization: token $GITEE_TOKEN" \
            -H "Content-Type: application/json" \
            "https://gitee.com/api/v5/repos/ScorchingSunnnn/bole-simulator/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Bole Simulator $TAG\",\"body\":\"$BODY\",\"target_commitish\":\"master\",\"prerelease\":false}")
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Release:', d.get('name','?'), 'ID:', d.get('id','?'))" 2>/dev/null || echo "Created"

          echo "=== Done ==="
          echo "https://gitee.com/ScorchingSunnnn/bole-simulator/releases/tag/$TAG"
