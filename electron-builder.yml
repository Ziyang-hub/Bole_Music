# ============================================================
# 伯乐模拟器 - Electron Builder 打包配置
# ============================================================

appId: com.bole.simulator
productName: 伯乐模拟器

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - resources/**/*


# GitHub 发布
publish:
  provider: github
  owner: scorching12
  repo: Bole_Music

# ============================================================
# Windows
# ============================================================
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ${productName}-${version}-Setup.${ext}
  # 请求管理员权限（减少杀软误报）
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 伯乐模拟器
  # 在安装目录创建卸载程序
  createStartMenuShortcut: true
  # 安装程序签名（无证书时跳过）
  # 注意：没有花钱买代码签名证书的话，Windows SmartScreen 仍会警告

# ============================================================
# macOS
# ============================================================
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip       # ZIP 格式：绕过 DMG 的隔离标记问题
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.music
  hardenedRuntime: true

# macOS DMG 设置
dmg:
  # 加 ${arch} 避免 x64 和 arm64 同时构建时卷标冲突
  title: Bole Simulator ${arch}

# ============================================================
# Linux
# ============================================================
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Audio
