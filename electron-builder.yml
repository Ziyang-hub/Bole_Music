# ============================================================
# 伯乐模拟器 - Electron Builder 打包配置
# ============================================================

appId: com.bole.simulator
productName: 伯乐模拟器

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

# GitHub 发布
publish:
  provider: github
  owner: scorching12
  repo: Bole_Music

# ============================================================
# Windows
# ============================================================
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ${productName}-${version}-Setup.${ext}
  # 请求管理员权限（减少杀软误报）
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 伯乐模拟器
  # 在安装目录创建卸载程序
  createStartMenuShortcut: true
  # 安装程序签名（无证书时跳过）
  # 注意：没有花钱买代码签名证书的话，Windows SmartScreen 仍会警告

# ============================================================
# macOS
# ============================================================
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip       # ZIP 格式：绕过 DMG 的隔离标记问题
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.music
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 在 ZIP 包中附带安装脚本
  extraResources:
    - from: scripts/mac-install.sh
      to: mac-install.sh

# macOS DMG 设置
dmg:
  title: 伯乐模拟器
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
      name: 拖到这里安装

# ============================================================
# Linux
# ============================================================
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Audio
